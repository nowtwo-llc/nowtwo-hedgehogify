name: Deploy demo to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 22.x
                  cache: npm

            - run: npm ci

            - name: Build library
              run: npm run build:prod

            # The demo loads ../dist/hedgehogify.min.js, and the bundle resolves
            # images at ../assets/. Mirroring the repo layout keeps those relative
            # paths identical locally and on Pages — nothing gets rewritten.
            - name: Assemble site
              run: |
                  mkdir -p _site/example
                  cp -r example/. _site/example/
                  cp -r dist _site/dist
                  cp -r assets _site/assets
                  printf '<!doctype html><meta http-equiv="refresh" content="0; url=./example/">\n' > _site/index.html

            - uses: actions/upload-pages-artifact@v5
              with:
                  path: _site

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
