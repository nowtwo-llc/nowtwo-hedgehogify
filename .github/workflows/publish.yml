name: Publish

on:
    release:
        types: [published]
    workflow_dispatch:

permissions:
    contents: read
    # packages: write for GitHub Packages; id-token: write for npm provenance,
    # which signs the tarball with an OIDC token proving it was built from this
    # repo and commit.
    packages: write
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 22.x
                  cache: npm
                  registry-url: https://registry.npmjs.org
                  scope: '@nowtwo-llc'

            - run: npm ci

            - name: Verify the release tag matches package.json
              run: |
                  PKG_VERSION="v$(node -p "require('./package.json').version")"
                  if [ "${{ github.event_name }}" = "release" ] && [ "$PKG_VERSION" != "${{ github.ref_name }}" ]; then
                    echo "Tag ${{ github.ref_name }} does not match package.json ($PKG_VERSION)" >&2
                    exit 1
                  fi

            - name: Test
              run: npm test

            # publishConfig.access is "public": scoped packages default to
            # restricted, which fails with a 402 on a free npm org.
            #
            # prepublishOnly runs build:prod, so dist/ is produced here rather than
            # being committed.
            #
            # NPM_TOKEN must be an "Automation" token so it bypasses 2FA.
            - name: Publish to npm
              run: npm publish --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            # GitHub Packages is an internal backup mirror. The npm and GitHub orgs
            # are both `nowtwo-llc`, so the same package name publishes to both and
            # only the registry changes.
            - uses: actions/setup-node@v5
              with:
                  node-version: 22.x
                  registry-url: https://npm.pkg.github.com
                  scope: '@nowtwo-llc'

            # publishConfig.registry overrides the --registry flag, so it has to be
            # rewritten rather than passed on the command line. The CI checkout is
            # ephemeral, so nothing is committed.
            - name: Point publishConfig at GitHub Packages
              run: npm pkg set publishConfig.registry="https://npm.pkg.github.com/"

            # No --provenance here: GitHub Packages does not accept provenance
            # attestations, and passing the flag fails the publish.
            - name: Publish to GitHub Packages
              run: npm publish
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
