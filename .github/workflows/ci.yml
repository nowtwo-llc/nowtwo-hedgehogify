name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                # Node 20 is excluded deliberately: jsdom 30 requires
                # ^22.22.2 || ^24.15.0 || >=26.0.0 and crashes on 20.x with
                # "webidl.util.markAsUncloneable is not a function". Node 20 also
                # reached end-of-life in April 2026.
                #
                # This is a development-toolchain floor only. The published package
                # is browser code and never executes in Node, so `engines` stays
                # permissive for consumers.
                node-version: [22.x, 24.x]

        steps:
            - uses: actions/checkout@v5

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm

            - run: npm ci

            - name: Lint
              run: npm run eslint -- --no-fix

            - name: Typecheck
              run: npm run typecheck

            - name: Test
              run: npm test

            - name: Build
              run: npm run build:prod
