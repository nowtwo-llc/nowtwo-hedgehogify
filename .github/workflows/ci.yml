name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Node 22 is the floor: jsdom 30 requires ^22.22.2 || ^24.15.0 || >=26.0.0
      # and dies on Node 20 with "webidl.util.markAsUncloneable is not a
      # function" before any test runs. Node 20 is also past end-of-life.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # lint:check rather than lint: the latter runs eslint --fix, which would
      # repair violations in the ephemeral checkout and pass regardless.
      - name: Lint
        run: npm run lint:check

      # The manifest is committed, so a new image added without running
      # `npm run assets` would otherwise only surface at build time.
      - name: Verify the asset manifest is up to date
        run: |
          npm run assets
          git diff --exit-code src/assets.generated.ts

      # Runs the suite with coverage so the thresholds in vitest.config.mts
      # are actually enforced; a plain `npm test` would skip them entirely.
      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build:prod

      - name: Verify package contents
        run: npm pack --dry-run
